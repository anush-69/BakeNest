<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bakery Menu</title>
    <style>
        .card { border: 1px solid #ddd; padding: 15px; margin: 10px; display: inline-block; width: 220px; text-align: center; vertical-align: top; }
        .menu-img { width: 150px; height: 150px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>

<h2>Bakery Menu & Products</h2>
<a href="/products/add">+ Add New Product</a>
<hr>

<div>
    <!-- Loop through all products fetched from the database -->
    <div class="card" th:each="product : ${products}">

        <!-- Display the uploaded image from the static folder -->
        <img class="menu-img" th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" alt="Bakery Item" />

        <h3 th:text="${product.name}">Product Name</h3>
        <p th:text="${product.description}">Description</p>
        <p><strong>Price: $</strong><span th:text="${product.price}">0.00</span></p>

        <a th:href="@{/products/delete/{id}(id=${product.id})}">Delete</a>
    </div>
</div>

</body>
</html>
